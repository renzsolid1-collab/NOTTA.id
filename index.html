:root{--bg:#ffd23f;--ink:#111;--pn:#fff;--mu:#5b5638;--pk:#ff3d7f;--ok:#12c98a;--px:"RenzPixel","Courier New",monospace;--bu:"Bungee",Impact,"Arial Black",sans-serif;--ch:"Chakra Petch","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg) linear-gradient(rgba(17,17,17,.07) 1px,transparent 1px) 0 0/24px 24px;background-image:linear-gradient(rgba(17,17,17,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(17,17,17,.07) 1px,transparent 1px);color:var(--ink);font:500 15px/1.4 var(--ch);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.w{max-width:560px;margin:0 auto;padding:20px 16px 56px}
.top{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.logo{width:70px;height:70px;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);background:#000;image-rendering:pixelated;transform:rotate(-3deg)}
h1{font:700 27px/1 var(--px)}
.top p{margin-top:7px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.na{padding:2px 7px;border:2.5px solid var(--ink);background:var(--ok);font:700 11px var(--px)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.tabs button{border:3px solid var(--ink);background:var(--pn);color:var(--ink);padding:10px 2px;font:700 13px var(--px);cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.tabs button.on{background:var(--ink);color:var(--bg);box-shadow:none;transform:translate(3px,3px)}
.sb{display:flex;gap:8px}
.sb input{flex:1;min-width:0;background:var(--pn);border:3px solid var(--ink);color:var(--ink);padding:13px;font:inherit;font-size:16px;font-weight:600;outline:0;box-shadow:3px 3px 0 var(--ink);border-radius:0}
.sb input:focus{box-shadow:4px 4px 0 var(--pk)}
.go{border:3px solid var(--ink);background:var(--pk);color:var(--ink);font:700 14px var(--px);padding:0 18px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.go:active,.pp:active,.ic:active,.wa:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.go:disabled{opacity:.55}
button:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.hint{font-size:12.5px;font-weight:600;margin:9px 2px 0}
.ld{display:none;margin:18px 0 4px}.ld.on{display:block}
.lr{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;font-weight:700;font-size:13px}
#pc{font:700 36px/1 var(--px);font-variant-numeric:tabular-nums}
.tk{height:20px;background:var(--pn);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.tk i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--pk) 0 9px,transparent 9px 12px)}
.st{margin:14px 2px;font-size:14px;font-weight:700;min-height:20px}.st.er{color:#b0123a}
.em{text-align:center;padding:36px 12px;font-size:14px;font-weight:600}
.sec{margin:22px 2px 10px;font:700 14px var(--px)}
.card{background:var(--pn);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:12px;margin-bottom:14px}
.card.on{box-shadow:4px 4px 0 var(--pk)}
.hd{display:flex;gap:12px;align-items:center}
.cv{position:relative;width:64px;height:64px;flex:none;border:3px solid var(--ink);overflow:hidden;background:#ddd}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.eq{position:absolute;inset:0;background:rgba(17,17,17,.72);display:none;align-items:flex-end;justify-content:center;gap:3px;padding-bottom:10px}
.card.pl .eq{display:flex}
